version: 1
disable_existing_loggers: True

formatters:
    default:
        format: '%(asctime)s %(levelname)s [%(name)s:%(lineno)d] %(message)s'
        datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
    CLP_file:
        class: clp_logging.handlers.CLPFileHandler
        level: DEBUG
        fpath: 'example.clp.zst'

root:
    level: DEBUG
    handlers: [CLP_file]
